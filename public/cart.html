<!doctype html>
<!-- This page displays the signed-in customer's cart and live server totals. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>Your cart | Cravely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/cart.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <a class="brand" href="/index.html"><span class="brand-mark">C</span>cravely<span class="brand-dot">.</span></a>
      <div class="delivery-label">DELIVER TO<span class="delivery-location">Kohalpur City</span></div>
      <div class="header-actions"><a class="icon-button" href="/cart.html" aria-label="Your cart">🛒<span class="cart-count" id="cart-count">0</span></a><a class="icon-button" href="/index.html" aria-label="Browse menu">←</a></div>
    </header>
    <section id="cart-content">
      <h1 class="page-title">Your cart</h1>
      <p class="page-subtitle">Freshly picked, just for you.</p>
      <div class="cart-layout">
        <div class="cart-list" id="cart-items"></div>
        <aside class="cart-side">
          <section class="promo-card">
            <h2>Promo code</h2>
            <form class="promo-form" id="promo-form">
              <label class="visually-hidden" for="promo-code">Enter promo code</label>
              <input class="search-input" id="promo-code" maxlength="30" placeholder="Enter code" autocomplete="off">
              <button class="button button-primary" type="submit">Apply</button>
            </form>
            <p class="form-message" id="promo-message" role="status"></p>
          </section>
          <section class="summary-card">
            <h2>Order summary</h2>
            <div id="summary-lines"></div>
            <p class="summary-note">Delivered fresh to Kohalpur City.</p>
            <a class="button button-primary proceed-button" id="proceed-button" href="/payment.html">Proceed to Payment · रु 0</a>
          </section>
        </aside>
      </div>
      <section class="empty-cart" id="empty-cart" hidden>
        <div class="empty-cart-icon" aria-hidden="true">🛒</div>
        <h1>Your cart is empty</h1>
        <p>Looks like you haven't added anything delicious yet.</p>
        <a class="button button-primary" href="/index.html">Browse Menu</a>
      </section>
      <p class="form-message" id="cart-message" role="status"></p>
    </section>
  </main>
</body>
</html>
